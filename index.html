<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Pet Pal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf5ec;--paper:#fffaf3;--ink:#3e2a2c;--line:#4b3536;--rose:#a8505e;--salmon:#efb3a2;--salmon2:#e59a86;
  --y:#fde7a5;--mint:#cdeee0;--lav:#e5d6f6;--peach:#fbd6c0;--sky:#cfe9f6;--ok:#4f9d69;--bad:#d4574f;--food:#f0a35e;--clean:#6fb7e8;--fun:#f2c94c;--walk:#7cc58a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background-color:#f6dfe3;background-image:radial-gradient(#ebbdc6 2.4px,transparent 2.6px);background-size:34px 34px;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--cream);box-shadow:0 0 0 2px rgba(75,53,54,.08)}
@media(min-width:620px){#app{margin:18px auto;min-height:calc(100vh - 36px);border:3px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(75,53,54,.35)}}
#top{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--y);border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
.brand{font-weight:900;font-size:17px;white-space:nowrap}
#chip{margin-left:auto;max-width:46%;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip.hidden+.zoom,#chip.hidden~#music{margin-left:auto}
.zoom{display:flex;align-items:center;gap:2px;border:2px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 4px}
.zoom button{width:26px;height:26px;font-weight:900;font-size:16px;border-radius:50%}
.zoom span{font-size:12px;font-weight:800;min-width:38px;text-align:center}
.zoom .fit{width:auto;padding:0 8px;font-size:12px;border-radius:999px;white-space:nowrap}
@media(max-width:619px){.zoom{display:none}}
.round{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:900;flex-shrink:0}
.round.on{background:var(--mint)}
#main{padding:8px 16px 28px}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- basics ---------- */
.tag{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.h1{font-weight:900;font-size:clamp(34px,9.6vw,46px);line-height:1.02;letter-spacing:-.02em}
.h2{font-weight:900;font-size:clamp(24px,6.6vw,32px);line-height:1.1;text-align:center}
.sub{font-weight:600;font-size:15px;color:#7a6264}
.center{text-align:center}
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);background:var(--salmon);font-weight:900;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.white{background:var(--paper)} .btn.mint{background:var(--mint)} .btn.y{background:var(--y)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.link{font-weight:800;font-size:14px;color:#6b5254;border-bottom:2px dotted #b39a9c;padding-bottom:1px;align-self:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.back{font-weight:800;font-size:15px;color:#6b5254;border-bottom:2px dotted #b39a9c;align-self:flex-start}
.cdot{display:inline-block;width:1em;height:1em;border-radius:50%;border:2px solid rgba(0,0,0,.18)}
.num{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:28%;background:var(--y);border:2px solid var(--line);font-weight:900;font-size:.72em}
.pic{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pic img{width:1.3em;height:1.3em;object-fit:cover;border-radius:12%}
.pic svg{width:1.1em;height:1.1em}
.fb{min-height:1.4em;font-weight:900;font-size:17px;text-align:center}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .45s}
@keyframes pop{45%{transform:scale(1.12)}}

/* ---------- pets ---------- */
svg.pet{display:block;width:100%;height:auto;overflow:visible}
.petbox{position:relative}
.petbox .pet{transform-origin:50% 95%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
.pet .tail{animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.petbox.jump .pet{animation:jump .5s ease 2}
@keyframes jump{0%,100%{transform:translateY(0)}15%{transform:scale(1.06,.92)}50%{transform:translateY(-20%) scale(.97,1.04)}}
.petbox.eat .pet{animation:eat .22s ease 5}
@keyframes eat{50%{transform:scale(1.05,.95)}}
.petbox.no .pet{animation:no .45s ease 2}
@keyframes no{30%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}
.petbox.run .pet{animation:run .18s ease-in-out infinite alternate}
@keyframes run{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8%) rotate(3deg)}}

/* ---------- landing ---------- */
.hero-scene{position:relative;border:2.5px solid var(--line);border-radius:28px 28px 22px 22px;overflow:hidden;aspect-ratio:1/0.92;background:linear-gradient(#cfe7f4 0 60%,#bfe0a7 60% 70%,#f1d2a7 70%);container-type:inline-size}
.hero-scene .sun{position:absolute;left:14%;top:12%;width:30%;aspect-ratio:1;border-radius:50%;background:#f6d779;box-shadow:0 0 0 7cqw rgba(255,255,255,.35)}
.hero-scene .wchip{position:absolute;padding:1.4cqw 3.4cqw;border-radius:999px;background:#fff;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:4.4cqw}
.hero-scene .pets{position:absolute;left:2%;right:2%;bottom:3%;display:flex;align-items:flex-end;justify-content:center}
.hero-scene .pets>div{width:34%}
.hero-scene .pets>div:nth-child(2){width:40%;margin:0 -4%;z-index:2}
.hero-scene .stripes{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(-12deg,transparent 0 9%,rgba(255,255,255,.25) 9% 12%)}

/* ---------- lists ---------- */
.packs{display:flex;flex-direction:column;gap:10px}
.pack{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.pack:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pack .pi{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--y);border:2px solid var(--line);flex-shrink:0}
.pack .pt{flex:1;display:flex;flex-direction:column;min-width:0}
.pack .pt b{font-size:17px} .pack .pt small{font-size:13px;color:#7a6264;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{padding:5px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:900;font-size:14px;white-space:nowrap}
.petcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px}
.petcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.petcard .pv{position:relative;width:100%;aspect-ratio:1}
.petcard .pv::before{content:'';position:absolute;inset:10% 8%;border-radius:50%;background:var(--bgc)}
.petcard .pv svg{position:relative}
.petcard b{font-size:17px} .petcard small{font-size:12px;color:#7a6264;text-align:center}
.petcard.on{background:var(--mint)}
.tinput{width:100%;padding:14px 16px;border-radius:16px;border:2.5px solid var(--line);font-size:22px;font-weight:800;text-align:center;outline:none;background:#fff;-webkit-user-select:text;user-select:text}

/* ---------- home ---------- */
.homehead{display:flex;align-items:center;gap:8px}
.lv{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:2px solid var(--line);background:var(--y);font-weight:900;font-size:14px;white-space:nowrap}
.xp{height:10px;border-radius:10px;border:2px solid var(--line);background:#fff;overflow:hidden;flex:1;min-width:30px}
.xp i{display:block;height:100%;background:var(--salmon2);transition:width .6s}
.scene{position:relative;width:100%;aspect-ratio:1/1.02;border:2.5px solid var(--line);border-radius:26px;overflow:hidden;container-type:inline-size;background:#f4dcc6}
.room .wall{position:absolute;inset:0 0 38% 0;background:linear-gradient(#f6e2cf,#efd2b8)}
.room .wall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3cqw;background:#e2b893}
.room .window{position:absolute;left:28%;right:28%;top:7%;height:40%;border-radius:22cqw 22cqw 2cqw 2cqw;border:2cqw solid #fff4e6;background:linear-gradient(#ffd9b8,#fff0d6 55%,#bfe3a6 56%,#9fd38a);overflow:hidden;box-shadow:0 0 0 .6cqw #d9b08a}
.room .window i{position:absolute;bottom:40%;width:12%;background:#e9a4a0;border-radius:2cqw 2cqw 0 0}
.room .window::before,.room .window::after{content:'';position:absolute;background:#fff4e6;z-index:2}
.room .window::before{left:47%;top:0;bottom:0;width:6%}
.room .window::after{left:0;right:0;top:50%;height:4%}
.room .curtain{position:absolute;top:4%;width:16%;height:50%;background:repeating-linear-gradient(90deg,#efa7a0 0 2.6cqw,#e79690 2.6cqw 5.2cqw);border-radius:0 0 4cqw 4cqw}
.room .curtain.l{left:16%} .room .curtain.r{right:16%}
.room .rod{position:absolute;left:12%;right:12%;top:3%;height:2cqw;border-radius:2cqw;background:#9b6a4a}
.room .floor{position:absolute;inset:62% 0 0 0;background:repeating-linear-gradient(90deg,#efc89c 0 16%,#e9bf90 16% 32%)}
.room .rug{position:absolute;left:10%;right:10%;top:70%;height:24%;border-radius:50%;background:radial-gradient(#f3c3b5 0 52%,#f7d6cc 53% 64%,#efb3a2 65%)}
.room .shelf{position:absolute;left:3%;top:30%;width:18%;height:2cqw;background:#c48e60;border-radius:1cqw}
.room .deco{position:absolute;transform:translate(-50%,-100%);line-height:0;cursor:pointer;z-index:2;filter:drop-shadow(0 .5cqw 0 rgba(75,53,54,.18))}
.room .deco svg{display:block;width:100%;height:auto;overflow:visible}
.tb{animation:blink 1.6s ease-in-out infinite}
.ihead{grid-column:1/-1;font-weight:900;font-size:15px;margin-top:6px}
.scene>.petbox{position:absolute;left:50%;bottom:9%;width:46%;transform:translateX(-50%)}
.scene .bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%);max-width:76%;padding:2cqw 4cqw;border-radius:5cqw;background:#fff;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:clamp(15px,4.6cqw,21px);text-align:center;z-index:5;cursor:pointer;white-space:nowrap}
.scene .bubble::after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top:10px solid var(--line)}
.stink{position:absolute;font-size:6cqw;opacity:.75;animation:stink 1.6s ease-in-out infinite}
@keyframes stink{50%{transform:translateY(-2cqw)}}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.need{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px}
.need span{font-size:20px;line-height:1}
.need small{font-weight:900;font-size:12px}
.need .bar{width:100%;height:9px;border-radius:9px;border:2px solid var(--line);background:#fff;overflow:hidden}
.need .bar i{display:block;height:100%;transition:width .6s}
.need.low{background:#ffe7e2}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;font-weight:900;font-size:14px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.act span{font-size:30px;line-height:1.1}
.act .dot{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;font-style:normal;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.acts.small .act{font-size:13px;padding:8px 2px 6px}
.acts.small .act span{font-size:22px}

/* ---------- activity frame ---------- */
.acttop{display:flex;align-items:center;gap:10px}
.acttop .pbar{flex:1;height:12px;border-radius:12px;background:#ece2d6;overflow:hidden}
.acttop .pbar i{display:block;height:100%;background:#8ccfa4;border-radius:12px;transition:width .5s}
.acttop b{font-size:15px;white-space:nowrap}
.prompt{position:absolute;left:5%;right:5%;top:4%;z-index:6;display:flex;align-items:center;justify-content:center;gap:2.4cqw;padding:3.2cqw 4cqw;border-radius:6cqw;background:var(--paper);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:center;flex-wrap:wrap}
.prompt small{font-weight:900;font-size:clamp(12px,3.4cqw,15px);color:#6b5254}
.prompt b{font-weight:900;font-size:clamp(20px,6.4cqw,30px);line-height:1.1}
.prompt .pp{font-size:11cqw;line-height:1}
.cookie{position:absolute;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;animation:float 3s ease-in-out infinite}
.cookie:nth-of-type(odd){animation-delay:-1.5s}
@keyframes float{50%{transform:translate(-50%,-58%) rotate(3deg)}}
.cookie svg{position:absolute;inset:0;width:100%;height:100%}
.cookie span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18%;font-weight:900;text-align:center;line-height:1.05;color:var(--ink);z-index:1}
.cookie.wrong{filter:grayscale(.9);opacity:.5}
.bowl{position:absolute;left:50%;bottom:5%;width:30%;transform:translateX(-50%);z-index:5}
.scene.garden{background:linear-gradient(#cfe9f6 0 30%,#d9efc4 30% 100%)}
.tree{position:absolute;border-radius:50%;background:#8fcb7a;border:2.5px solid #5f9a55;aspect-ratio:1}
.garden .fence{position:absolute;left:0;right:0;top:27%;height:9%;background:repeating-linear-gradient(90deg,#fff 0 5%,transparent 5% 8%);border-bottom:1cqw solid #fff}
.garden .path{position:absolute;left:0;right:0;bottom:12%;height:20%;background:#efcfa9;border-top:2.5px solid #e0b88b;border-bottom:2.5px solid #e0b88b}
.garden .flower{position:absolute;font-size:5cqw}
.wopts{position:absolute;left:7%;right:7%;top:25%;display:flex;flex-direction:column;gap:3cqw;z-index:5}
.wopt{display:flex;align-items:center;justify-content:center;position:relative;padding:3.4cqw 10cqw;border-radius:5cqw;background:var(--paper);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:clamp(16px,4.8cqw,22px)}
.wopt::after{content:'➜';position:absolute;right:4cqw;color:#e0866f;font-size:1.1em}
.wopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.wopt.right{background:#dff3e5} .wopt.wrong{opacity:.45}
.walker{position:absolute;bottom:13%;width:24%;transition:left 1.1s ease-in-out;z-index:4}
.goal{position:absolute;right:3%;bottom:24%;font-size:11cqw;z-index:3}
.scene.bath{background:linear-gradient(#e3f2fb 0 70%,#cfe5f2 70%)}
.bath .tiles{position:absolute;inset:0 0 30% 0;background-image:linear-gradient(rgba(255,255,255,.7) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.7) 2px,transparent 2px);background-size:10cqw 10cqw}
.bath .tub{position:absolute;left:10%;right:10%;bottom:4%;height:30%;z-index:3;pointer-events:none}
.bath .tub svg{width:100%;height:100%}
.scene.bath>.petbox{bottom:18%;width:42%}
.bbl{position:absolute;bottom:-18%;width:16cqw;height:16cqw;border-radius:50%;font-size:8cqw;font-weight:900;color:#2f6f99;z-index:6;
  background:radial-gradient(circle at 30% 28%,#fff 0,rgba(255,255,255,.75) 22%,rgba(200,232,250,.5) 62%,rgba(160,212,245,.4) 100%);border:2.5px solid #fff;box-shadow:inset -4px -6px 10px rgba(111,183,232,.25),0 2px 6px rgba(111,183,232,.3);animation:riseB linear forwards}
@keyframes riseB{to{bottom:108%}}
.bbl.popped{animation:popB .3s forwards!important}
@keyframes popB{to{transform:scale(1.8);opacity:0}}
.wordbar{position:absolute;left:4%;right:4%;top:3%;z-index:7;display:flex;align-items:center;gap:3cqw;padding:2.4cqw 3cqw;border-radius:5cqw;background:var(--paper);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line)}
.wordbar .wp{font-size:11cqw;line-height:1;cursor:pointer}
.wordbar .wr{font-weight:900;font-size:clamp(14px,4cqw,18px);color:#6b5254}
.slots{display:flex;gap:1.2cqw;flex-wrap:wrap}
.slot{width:8.4cqw;height:10cqw;border:2.5px dashed #9fc6de;border-radius:2cqw;display:flex;align-items:center;justify-content:center;font-size:6.4cqw;font-weight:900;background:#fff;color:#cdd9e0}
.slot.filled{border-style:solid;border-color:var(--line);color:var(--ink);background:var(--mint)}
.slot.next{border-color:var(--salmon2);box-shadow:0 0 0 2px #ffe0d6}
.sparkle{position:absolute;font-size:7cqw;pointer-events:none;animation:spark 1s ease-out forwards;z-index:8}
@keyframes spark{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-6cqw);opacity:0}}
.scene.yard{background:linear-gradient(#d5ecf7 0 26%,#cde9b3 26%);aspect-ratio:1/1.22}
.yard .picopt{aspect-ratio:1.6;font-size:13cqw}
.picopts{position:absolute;left:5%;right:5%;top:25%;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;z-index:5}
.picopt{aspect-ratio:1.25;border-radius:5cqw;background:var(--paper);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;font-size:15cqw;line-height:1}
.picopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.picopt.right{background:#dff3e5} .picopt.wrong{opacity:.4}
.picopt .pic img{width:1.4em;height:1.1em;object-fit:contain}
.listen{width:15cqw;height:15cqw;border-radius:50%;background:#bfe1f2;border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:7cqw}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.scene.yard>.petbox{width:25%;bottom:2%}
.walker .petbox{width:100%}

/* practice (lesson) */
.lesson{padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:440px;position:relative}
.lesson .q{font-weight:700;font-size:16px;color:#6b5254;text-align:center;padding:0 54px}
.lesson .bigpic{font-size:110px;line-height:1;min-height:110px;display:flex;align-items:center}
.lesson .bigpic .pic img{width:1.4em;height:1.2em;object-fit:contain}
.lopts{display:flex;flex-direction:column;gap:10px;width:100%}
.lopt{padding:13px;border-radius:14px;background:var(--paper);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:18px}
.lopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lopt.right{background:#dff3e5} .lopt.wrong{opacity:.45}
.lpics{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.lpics .picopt{font-size:62px;aspect-ratio:1.2;border-radius:16px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:24px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile.used{visibility:hidden}

<script>
/* =====================================================================
   MY PET PAL — learn words, look after a pet (Kid's Box 1 word packs)
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let timers = [], intervals = [];
const later = (f, ms) => timers.push(setTimeout(f, ms));
const every = (f, ms) => intervals.push(setInterval(f, ms));
function clearTimers(){ timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; }
function anim(el, c){ if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
const todayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 864e5);

/* ================= VOICE, SOUND, MUSIC ================= */
/* Voice: the game ranks the English voices of this device and takes the most natural one.
   "Natural / Neural / Online / Premium / Enhanced" voices (Edge, Chrome, iPhone/iPad) sound almost human. */
let VOICES = [];
const ROBOTIC = /espeak|compact|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Hysterical|Organ|Ralph|Junior|Deranged|Pipe Organ|Good News|Jester|Superstar|Bahh|Grandpa|Grandma|Rocko|Shelley|Sandy|Flo|Eddy|Reed/i;
function voiceScore(v){
  const n = v.name; let s = 0;
  if (/natural|neural|premium|enhanced|wavenet|studio/i.test(n)) s += 60;
  if (/online/i.test(n)) s += 10;
  if (/Google/i.test(n)) s += 30;
  if (/Ana|Jenny|Aria|Emma|Ava|Michelle|Samantha|Allison|Susan|Zira|Karen|Moira|Tessa|Serena|Libby|Sonia|Maisie|Nancy|Joanna|Salli|Kendra|Ivy|Female/i.test(n)) s += 15;
  if (/en[-_]US/i.test(v.lang)) s += 6; else if (/en[-_](GB|AU|IE)/i.test(v.lang)) s += 4;
  if (/\bAna\b/i.test(n)) s -= 3;   // Ana is a child voice: it is kept for the pet
  if (ROBOTIC.test(n)) s -= 80;
  return s;
}
const isNice = v => voiceScore(v) >= 55;
function loadVoices(){
  VOICES = window.speechSynthesis ? speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang)).sort((a,b) => voiceScore(b) - voiceScore(a)) : [];
}
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceSet(){ try { return {voice:DB.voice || '', rate:DB.rate || .85}; } catch(e){ return {voice:'', rate:.85}; } }
function mainVoice(){ if (!VOICES.length) loadVoices(); const w = voiceSet().voice; return (w && VOICES.find(v => v.name === w)) || VOICES[0] || null; }
/* the pet talks with a child voice if the device has one (e.g. "Ana" in Microsoft Edge) */
function petVoice(){ return VOICES.find(v => /\bAna\b/i.test(v.name) && /natural|online/i.test(v.name)) || mainVoice(); }
function say(t, pet = false){
  if (!window.speechSynthesis || !t) return;
  const clean = String(t).replace(/<[^>]+>/g,'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}️]/gu,'').trim();
  if (!clean) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  const v = pet ? petVoice() : mainVoice(), kid = pet && v && /\bAna\b/i.test(v.name);
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  const r = voiceSet().rate;
  u.rate = pet ? Math.min(1, r + .05) : r;
  u.pitch = pet ? (kid ? 1.05 : (v && isNice(v) ? 1.15 : 1.3)) : 1.02;
  u.volume = 1;
  setTimeout(() => speechSynthesis.speak(u), 60);
}
let actx;
function ac(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); }catch(e){} return actx; }
function tone(f, d, vol = .07, delay = 0, type = 'sine'){
  const a = ac(); if (!a) return;
  try{ const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d); }catch(e){}
}
const sfx = {
  ok(){ [523,659,784,1047].forEach((f,i) => tone(f,.18,.07,i*.07)); }, bad(){ tone(330,.18,.05); tone(262,.25,.05,.12); },
  click(){ tone(700,.05,.03); }, pop(){ tone(900,.06,.07); tone(1300,.07,.04,.03); }, coin(){ tone(988,.08,.06); tone(1319,.14,.06,.08); },
  chomp(){ [220,260,220].forEach((f,i) => tone(f,.08,.07,i*.12,'triangle')); }, squeak(){ tone(1200,.06,.04); tone(1500,.07,.04,.07); },
  win(){ [523,659,784,659,784,1047].forEach((f,i) => tone(f,.22,.08,i*.11)); }
};

function musicOn(on){
  clearInterval(musicTimer); musicTimer = null;
  $('#music').classList.toggle('on', on);
  if (!on) return;
  musicTimer = setInterval(() => {
    if (!actx || actx.state !== 'running') return;
    const mel = isNY() ? JINGLE : MELODY, f = mel[musicStep % mel.length];
    if (f) tone(f, .5, .022, 0, 'triangle');
    if (isNY() && musicStep % 2 === 0) tone(2600, .05, .006);
    if (musicStep % 4 === 0) tone([131,175,196,165][(musicStep/4|0) % 4], 1.4, .02, 0, 'sine');
    musicStep++;
  }, 420);
}

/* ================= NEW YEAR SEASON =================
   on by itself from 14 December to 14 January (device date); the teacher can also switch it on/off in Settings */
/* WINTER: 17 November – 1 March every year. NEW YEAR: 14 December – 14 January (it takes over from winter on its days). */
function inSeason(d = new Date()){ const m = d.getMonth(), day = d.getDate(); return (m === 11 && day >= 14) || (m === 0 && day <= 14); }
function inWinter(d = new Date()){ const m = d.getMonth(), day = d.getDate(); return (m === 10 && day >= 17) || m === 11 || m === 0 || m === 1 || (m === 2 && day === 1); }
function seasonMode(){ let m = 'auto'; try { m = DB.season || (DB.nyMode === 'on' ? 'ny' : DB.nyMode === 'off' ? 'off' : 'auto'); } catch(e){} return m; }
function season(){ const m = seasonMode(); if (m === 'ny' || m === 'winter') return m; if (m === 'off') return ''; return inSeason() ? 'ny' : inWinter() ? 'winter' : ''; }
function isNY(){ return season() === 'ny'; }
function isSnow(){ return season() !== ''; }      /* snowy look: in winter and at New Year */
function isWinterOnly(){ return season() === 'winter'; }
const seasonId = (d = new Date()) => String(d.getMonth() === 0 ? d.getFullYear() - 1 : d.getFullYear());
function applySeason(){ document.body.classList.toggle('ny', isNY()); document.body.classList.toggle('snow', isSnow()); }

function garlandHTML(){
  /* hangs from the curtain rod in 3 soft loops; every bulb sits right on the wire */
  const cols = ['#ff4d4d','#ffd23f','#3fbf5f','#4aa3ff','#ff6fb5'];
  let wire = 'M0 3', bulbs = '', n = 0;
  for (let s = 0; s < 3; s++){
    const x0 = s*100, cx = x0 + 50, cy = 50;
    wire += ` Q${cx} ${cy} ${x0+100} 3`;
    [.14,.32,.5,.68,.86].forEach(t => {
      const x = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*(x0+100), y = (1-t)*(1-t)*3 + 2*(1-t)*t*cy + t*t*3;
      const c = cols[n % cols.length];
      bulbs += `<g><circle class="glow" cx="${x.toFixed(1)}" cy="${(y+10).toFixed(1)}" r="10" fill="${c}" style="animation-delay:${(n%3)*.55}s"/>
        <rect x="${(x-3).toFixed(1)}" y="${(y-1).toFixed(1)}" width="6" height="5.5" rx="1.2" fill="#3c4a3f"/>
        <path d="M${(x-4.6).toFixed(1)} ${(y+5).toFixed(1)}Q${(x-5.6).toFixed(1)} ${(y+16).toFixed(1)} ${x.toFixed(1)} ${(y+19).toFixed(1)}Q${(x+5.6).toFixed(1)} ${(y+16).toFixed(1)} ${(x+4.6).toFixed(1)} ${(y+5).toFixed(1)}Z" fill="${c}" stroke="#4b3536" stroke-width="1.4"/>
        <ellipse cx="${(x-1.6).toFixed(1)}" cy="${(y+9).toFixed(1)}" rx="1.3" ry="2.6" fill="#fff" opacity=".75"/></g>`;
      n++;
    });
  }
  return `<div class="garland"><svg viewBox="-6 -2 312 52" xmlns="http://www.w3.org/2000/svg" overflow="visible">
    <path d="${wire}" stroke="#2c5e3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>${bulbs}
    <circle cx="0" cy="3" r="3.4" fill="#9b6a4a" stroke="#4b3536" stroke-width="1.2"/><circle cx="300" cy="3" r="3.4" fill="#9b6a4a" stroke="#4b3536" stroke-width="1.2"/></svg></div>`;
}

function prepSVG(p){
  const ball = (x,y) => `<circle cx="${x}" cy="${y}" r="13" fill="#ff6b6b" stroke="#4b3536" stroke-width="3"/>`;
  if (p === 'under') return `<svg viewBox="0 0 120 100"><rect x="14" y="32" width="92" height="11" rx="4" fill="#c48e60" stroke="#4b3536" stroke-width="3"/><rect x="20" y="43" width="9" height="46" fill="#9b6a4a"/><rect x="91" y="43" width="9" height="46" fill="#9b6a4a"/>${ball(60,76)}</svg>`;
  const box = `<rect x="28" y="50" width="64" height="42" rx="4" fill="#d9a46b" stroke="#4b3536" stroke-width="3"/>`;
  if (p === 'on') return `<svg viewBox="0 0 120 100">${box}${ball(60,36)}</svg>`;
  if (p === 'behind') return `<svg viewBox="0 0 120 100">${ball(74,46)}${box}</svg>`;
  if (p === 'front') return `<svg viewBox="0 0 120 100">${box}<circle cx="60" cy="80" r="15" fill="#ff6b6b" stroke="#4b3536" stroke-width="3"/></svg>`;
  if (p === 'next') return `<svg viewBox="0 0 120 100"><rect x="14" y="50" width="54" height="42" rx="4" fill="#d9a46b" stroke="#4b3536" stroke-width="3"/>${ball(92,78)}</svg>`;
  if (p === 'between') return `<svg viewBox="0 0 120 100"><rect x="4" y="50" width="38" height="42" rx="4" fill="#d9a46b" stroke="#4b3536" stroke-width="3"/><rect x="78" y="50" width="38" height="42" rx="4" fill="#d9a46b" stroke="#4b3536" stroke-width="3"/>${ball(60,78)}</svg>`;
  return `<svg viewBox="0 0 120 100">${ball(60,58)}${box}<rect x="28" y="50" width="64" height="12" fill="#c48e5a" stroke="#4b3536" stroke-width="3"/></svg>`;
}
/* item picture: "#hex" colour · "n:5" number · "svg:key" · "prep:in" · emoji · or an uploaded image (item.img) */
function picHTML(it){
  if (it.img) return `<span class="pic"><img src="${it.img}" alt=""></span>`;
  const c = String(it.pic || '❓');
  if (c[0] === '#') return `<span class="pic"><span class="cdot" style="background:${esc(c)}"></span></span>`;
  if (c.startsWith('n:')) return `<span class="pic"><span class="num">${esc(c.slice(2))}</span></span>`;
  if (c.startsWith('svg:')) return `<span class="pic">${SVGS[c.slice(4)] || '❓'}</span>`;
  if (c.startsWith('prep:')) return `<span class="pic">${prepSVG(c.slice(5))}</span>`;
  return `<span class="pic">${esc(c)}</span>`;
}
const isEmoji = it => it.pic && !it.img && !/^(#|n:|svg:|prep:)/.test(it.pic);

const main = $('#main');
function view(html){ clearTimers(); if (window.speechSynthesis) speechSynthesis.cancel(); main.innerHTML = `<div class="view">${html}</div>`; window.scrollTo(0,0); }
function setChip(t){ const c = $('#chip'); c.textContent = t || ''; c.classList.toggle('hidden', !t); }
let toastT;
function toast(m){ const t = $('#toast'); t.innerHTML = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
let mq = [], mopen = false;
function modal(html, onOpen){ mq.push([html, onOpen]); if (!mopen) nextModal(); }
function nextModal(){ const m = mq.shift(); if (!m){ mopen = false; $('#modal').classList.add('hidden'); return; } mopen = true; $('#mcard').innerHTML = m[0]; $('#modal').classList.remove('hidden'); $('#mcard').scrollTop = 0; if (m[1]) m[1](); }
const closeModal = () => nextModal();
function confetti(items = ['⭐','🎉','💛','🌸'], n = 22){
  if ($$('.drop').length > 30) return;
  for (let i = 0; i < n; i++){ const d = document.createElement('div'); d.className = 'drop'; d.textContent = rnd(items);
    d.style.left = Math.random()*100 + 'vw'; d.style.animationDuration = (2 + Math.random()*2) + 's'; d.style.animationDelay = Math.random() + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
}
function flyTo(el, target, dur = 700){
  if (!el || !target) return;
  const a = el.getBoundingClientRect(), b = target.getBoundingClientRect();
  const c = el.cloneNode(true); c.classList.add('fly'); c.removeAttribute('id');
  Object.assign(c.style, {left:a.left+'px', top:a.top+'px', width:a.width+'px', height:a.height+'px', margin:0, animation:'none', transform:'none'});
  document.body.appendChild(c);
  const dx = b.left + b.width/2 - (a.left + a.width/2), dy = b.top + b.height/2 - (a.top + a.height/2);
  c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5 - 50}px) scale(.8)`, offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.3)`, opacity:.3}], {duration:dur, easing:'ease-in-out'}).onfinish = () => c.remove();
}
function petAnim(box, cls, ms = 1100){ if (!box) return; box.classList.remove('jump','eat','no','run'); void box.offsetWidth; box.classList.add(cls); if (ms) setTimeout(() => box.classList.remove(cls), ms); }

/* zoom (for a big screen / projector) */
function applyZoom(){ $('#app').style.zoom = DB.zoom; $('#zv').textContent = Math.round(DB.zoom*100) + '%'; }
$('#zoom').onclick = e => {
  const z = e.target.closest('[data-z]'); if (!z) return;
  if (z.dataset.z === '+') DB.zoom = Math.min(2, +(DB.zoom + .1).toFixed(2));
  else if (z.dataset.z === '-') DB.zoom = Math.max(.6, +(DB.zoom - .1).toFixed(2));
  else DB.zoom = +clamp(Math.min(innerWidth/600, innerHeight/1000), .6, 2).toFixed(2);
  save(); applyZoom();
};

/* ================= WORD PICKING (weak words come back more often) ================= */
const isSpell = it => !it.ph && /^[a-z]{2,10}$/i.test(it.en);
const hasPic = it => !!(it.img || it.pic);
function pickItem(f, used){
  let pool = PACK.words.filter(f || (() => true)); if (!pool.length) pool = PACK.words;
  const fresh = pool.filter(it => !used || !used.has(it.en)); if (fresh.length) pool = fresh;
  const now = Date.now();
  const w = pool.map(it => { const m = mOf(it); return 1 / (1 + Math.max(0, m.ok - m.bad)) + (now - m.t > 864e5 ? .6 : 0) + (m.ok === 0 ? .8 : 0); });
  let r = Math.random() * w.reduce((a,b) => a + b, 0);
  for (let i = 0; i < pool.length; i++){ r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function distractors(it, n, f){
  const same = x => x.en !== it.en && x.ru !== it.ru && !!x.ph === !!it.ph && (!f || f(x));
  let pool = shuffle(PACK.words.filter(same));
  if (pool.length < n) pool = pool.concat(shuffle(ALL_WORDS.filter(x => same(x) && !pool.some(y => y.en === x.en))));
  return pool.slice(0, n);
}
function record(it, ok){
  const k = mkey(it), m = P.m[k] || {ok:0, bad:0, t:0};
  if (ok) m.ok++; else m.bad++;
  m.t = Date.now(); P.m[k] = m;

function b64enc(obj){ const s = unescape(encodeURIComponent(JSON.stringify(obj))); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length % 4) str += '='; return JSON.parse(decodeURIComponent(escape(atob(str)))); }
function decodeAny(text){
  text = String(text || '').trim();
  if (text.startsWith('{')) return JSON.parse(text);
  const m = text.match(/#pack=([A-Za-z0-9_\-]+)/);
  return b64dec(m ? m[1] : text.replace(/\s+/g,''));
}
function parsePack(obj){
  if (!obj || !Array.isArray(obj.words)) throw new Error('bad');
  const words = obj.words.filter(w => w && w.en && String(w.en).trim()).map(w => {
    const en = String(w.en).trim().slice(0,60);
    return {en, ru:String(w.ru || '').slice(0,80), pic:w.pic ? String(w.pic).slice(0,40) : '', img:w.img && String(w.img).startsWith('data:image/') ? w.img : '', ph:!!w.ph || (/\s/.test(en) && /[.?!]$/.test(en))};
  });
  if (words.length < 2) throw new Error('few');
  return {id:String(obj.id || ('pk' + Date.now().toString(36))).slice(0,40), title:String(obj.title || 'My word pack').slice(0,60), words};
}
function storePack(pk){
  if (/^(kb|k2)/.test(pk.id)) pk.id = 'pk' + pk.id;
  const i = DB.packs.findIndex(p => p.id === pk.id);
  if (i >= 0) DB.packs[i] = pk; else DB.packs.push(pk);
  save(); return pk;
}
/* a pack file / code / link — or a backup code with players */
function importText(text){
  const obj = decodeAny(text);
  if (obj && Array.isArray(obj.players)){
    (obj.packs || []).forEach(p => { try { storePack(parsePack(p)); } catch(e){} });
    let n = 0;
    obj.players.forEach(p => { if (!p || !p.id || !p.name) return; fixPlayer(p); const i = DB.players.findIndex(x => x.id === p.id); if (i >= 0) DB.players[i] = p; else DB.players.push(p); n++; });
    save(); sfx.win(); toast(`Прогресс восстановлен ✔ (${n})`); whoPlays(null); return;
  }
  packLoaded(storePack(parsePack(obj)));
}

function startAct(kind){

  if (kind === 'play' && PACK.words.filter(x => hasPic(x) && !x.ph).length < 2){ toast('В наборе мало картинок — играем в Walk'); kind = 'walk'; }
  A = {kind, i:0, n:ACTS[kind].n, score:0, results:[], used:new Set(), missed:false};

}
function topHTML(){ return `<div class="acttop"><button class="back" id="leave">← Leave</button><div class="pbar"><i style="width:${A.i/A.n*100}%"></i></div><b>${Math.min(A.i+1, A.n)} / ${A.n}</b></div>`; }
function round(){
  clearTimers(); if (window.speechSynthesis) speechSynthesis.cancel();
  A.missed = false; A.locked = false;
  ({feed:feedRound, walk:walkRound, play:playRound, wash:washRound, practice:practiceRound, snow:snowRound})[A.kind]();
  $('#leave').onclick = () => { sfx.click(); renderHome(); };

function answer(ok, it){

    A.locked = true;
    if (!A.missed){ A.score++; record(it, true); }
    A.results.push({it, ok:!A.missed}); A.used.add(it.en);

}
function nextRound(ms = 1300){ const a = A; later(() => { if (A !== a) return; A.i++; if (A.i >= A.n) finish(); else round(); }, ms); }
function finish(){
  const cfg = ACTS[A.kind], k = A.kind, score = A.score, n = A.n;
  const xp = 5 + score*3 + (A.results.length - score), coins = 4 + score*2;
  if (cfg.stat) P.stats[cfg.stat] = clamp(P.stats[cfg.stat] + 40 + 60*score/n, 0, 100);
  else NEEDS.forEach(([s]) => P.stats[s] = clamp(P.stats[s] + 8, 0, 100));
  if (k === 'walk') P.stats.fun = clamp(P.stats.fun + 10, 0, 100);
  if (k === 'snow') P.stats.walk = clamp(P.stats.walk + 15, 0, 100);
  if (k === 'play' || k === 'walk') P.stats.food = clamp(P.stats.food - 5, 0, 100);
  P.coins += coins; P.last = Date.now();
  const seen = new Set(), miss = A.results.filter(r => !r.ok && !seen.has(r.it.en) && seen.add(r.it.en)).map(r => r.it);
  save();
  const stars = score >= n*.85 ? 3 : score >= n*.5 ? 2 : 1;
  modal(`<div class="mp">${myPet({mood:'joy', dirt:0})}</div><h2>${cfg.title}</h2><p ${sayA(cfg.line, true)}>${cfg.line} 🔊</p>

    <div class="rewards"><span>+${xp} XP</span><span>+${coins} 🪙</span></div>
    ${miss.length ? `<p class="note">Practise these words:</p><div class="chips" style="justify-content:center">${miss.map(it => `<button class="chip" ${sayA(it.en)}>${picHTML(it)} ${esc(it.en)}</button>`).join('')}</div>` : ''}
    <div class="mrow"><button class="btn white" id="rAgain">🔄 Again</button><button class="btn" id="rHome">🏠 Home</button></div>`, () => {

}
function addXP(x){

function burst(b){ b.style.bottom = getComputedStyle(b).bottom; b.style.animationDuration = '.3s'; b.style.animationDelay = '0s'; b.classList.add('popped'); setTimeout(() => b.remove(), 330); }

function popBubble(b){
  if (!A || !A.on || b.classList.contains('popped')) return;
  const w = A.word;
  if (b.dataset.l === w[A.pos]){
    burst(b); sfx.pop(); say(b.dataset.l);
    const sl = $$('#slots .slot'); sl[A.pos].textContent = w[A.pos]; sl[A.pos].classList.add('filled'); sl[A.pos].classList.remove('next');
    A.pos++;
    if (A.pos < w.length){ sl[A.pos].classList.add('next'); $('#fb').className = 'fb'; $('#fb').textContent = 'Pop the letters in order! 🫧'; }
    else {
      A.on = false; answer(true, A.it);
      $$('.bbl').forEach(x => { if (!x.classList.contains('popped')) burst(x); });
      const sc = $('#sc');
      for (let i = 0; i < 6; i++){ const s = document.createElement('span'); s.className = 'sparkle'; s.textContent = rnd(['✨','🫧','⭐']); s.style.left = (25 + Math.random()*50) + '%'; s.style.top = (35 + Math.random()*35) + '%'; sc.appendChild(s); setTimeout(() => s.remove(), 1200); }
      $('#pet').innerHTML = myPet({dirt:Math.max(0, 1 - (A.i+1)/A.n), mood:'joy'}); petAnim($('#pet'), 'jump');
      $('#fb').className = 'fb ok'; $('#fb').textContent = `✔ ${A.it.en}${A.it.ru ? ' — ' + A.it.ru : ''}`; later(() => say(A.it.en), 400);
      nextRound(2100);
    }
  } else {
    if (!A.missed){ A.missed = true; record(A.it, false); }
    sfx.bad(); b.style.borderColor = '#f0a59a'; $('#fb').className = 'fb bad'; $('#fb').innerHTML = `We need <b>${w[A.pos]}</b>!`;
  }
}

/* ---- PRACTICE: listen · picture · build the word · translate ---- */
const TILE_COL = ['var(--y)','var(--mint)','var(--lav)','var(--peach)','var(--sky)'];
function practiceRound(){
  const pics = PACK.words.filter(x => hasPic(x) && !x.ph).length >= 2;
  let type = ['listen','picture','build','ru'][A.i % 4];
  if (type === 'build' && !PACK.words.some(isSpell)) type = 'ru';
  if ((type === 'listen' || type === 'picture') && !pics) type = 'ru';
  if (type === 'ru' && !PACK.words.some(x => x.ru)) type = pics ? 'picture' : 'listen2';
  const dots = `<div class="dots5">${Array.from({length:A.n}, (_,i) => `<i class="${i < A.results.length ? (A.results[i].ok ? 'ok' : 'bad') : i === A.i ? 'now' : ''}"></i>`).join('')}</div>`;
  const shell = inner => { main.innerHTML = `<div class="view">${topHTML()}<div class="card lesson">${inner}<div style="flex:1"></div>${dots}<div class="peek">${myPet({mood:'happy'})}</div></div><div class="fb" id="fb"></div></div>`; };
  const okFb = it => { $('#fb').className = 'fb ok'; $('#fb').textContent = `✔ ${it.en}${it.ru ? ' — ' + it.ru : ''}`; };
  if (type === 'listen'){
    const it = pickItem(x => hasPic(x) && !x.ph, A.used), opts = shuffle([it, ...distractors(it, 3, x => hasPic(x) && x.pic !== it.pic)]);
    shell(`<div class="q">Listen and choose the picture</div><button class="listen" id="hear" style="width:64px;height:64px;font-size:28px">🔊</button>
      <div class="lpics">${opts.map((o,i) => `<button class="picopt" data-i="${i}">${picHTML(o)}</button>`).join('')}</div>`);
    $('#hear').onclick = () => say(it.en); later(() => say(it.en), 300);
    $$('.picopt').forEach(b => b.onclick = () => { const o = opts[+b.dataset.i]; if (answer(o === it, it)){ b.classList.add('right'); say(it.en); okFb(it); nextRound(); } else if (!A.locked){ b.classList.add('wrong'); anim(b,'shake'); later(() => say(it.en), 500); } });
  } else if (type === 'picture' || type === 'ru' || type === 'listen2'){
    const f = type === 'picture' ? (x => hasPic(x)) : type === 'ru' ? (x => !!x.ru) : null;
    const it = pickItem(f, A.used), opts = shuffle([it, ...distractors(it, 3)]);
    shell(`<div class="q">${type === 'picture' ? 'Look at the picture. Which word is it?' : type === 'ru' ? 'How do you say it in English?' : 'Listen. Which word is it?'}</div>
      ${type === 'picture' ? `<div class="bigpic">${picHTML(it)}</div>` : type === 'ru' ? `<div class="h2" style="margin:14px 0">${esc(it.ru)}</div>` : `<button class="listen" id="hear" style="width:64px;height:64px;font-size:28px">🔊</button>`}
      <div class="lopts">${opts.map((o,i) => `<button class="lopt" data-i="${i}">${esc(o.en)}</button>`).join('')}</div>`);
    if ($('#hear')){ $('#hear').onclick = () => say(it.en); later(() => say(it.en), 300); }
    $$('.lopt').forEach(b => b.onclick = () => { const o = opts[+b.dataset.i]; say(o.en); if (answer(o === it, it)){ b.classList.add('right'); okFb(it); nextRound(); } else if (!A.locked){ b.classList.add('wrong'); anim(b,'shake'); } });
  } else {
    const it = pickItem(isSpell, A.used), w = it.en.toLowerCase();
    let mixed, tries = 0; do { mixed = shuffle([...w]); } while (mixed.join('') === w && ++tries < 20);
    A.tiles = mixed.map((c,i) => ({id:i, c, used:false})); A.slots = Array(w.length).fill(null);
    shell(`<div class="q">Build the word</div><div class="bigpic" ${sayA(it.en)} style="font-size:90px;min-height:90px">${picHTML(it)}</div><div class="note">${esc(it.ru)}</div>
      <div class="tslots" id="ts"></div><div class="tiles" id="tt"></div>
      <div class="grid2" style="width:100%"><button class="btn white" id="clr">Clear</button><button class="btn" id="chk">Check</button></div>`);
    const draw = () => {
      $('#ts').innerHTML = A.slots.map((id,i) => `<div class="tslot ${id !== null ? 'filled' : ''}" data-i="${i}" ${id !== null ? `style="background:${TILE_COL[id % 5]}"` : ''}>${id !== null ? A.tiles[id].c : ''}</div>`).join('');
      $('#tt').innerHTML = A.tiles.map(t => `<button class="tile ${t.used ? 'used' : ''}" data-id="${t.id}" style="background:${TILE_COL[t.id % 5]}">${t.c}</button>`).join('');
      $$('#tt .tile').forEach(b => b.onclick = () => { if (A.locked) return; const t = A.tiles[+b.dataset.id]; const i = A.slots.indexOf(null); if (i < 0 || t.used) return; A.slots[i] = t.id; t.used = true; sfx.click(); say(t.c); draw(); });
      $$('#ts .tslot').forEach(s => s.onclick = () => { if (A.locked) return; const i = +s.dataset.i, id = A.slots[i]; if (id === null) return; A.tiles[id].used = false; A.slots[i] = null; draw(); });
    };
    draw();
    $('#clr').onclick = () => { if (A.locked) return; A.slots.fill(null); A.tiles.forEach(t => t.used = false); draw(); };
    $('#chk').onclick = () => {
      if (A.locked) return;
      if (A.slots.includes(null)){ anim($('#ts'),'shake'); $('#fb').className = 'fb bad'; $('#fb').textContent = 'Use all the letters!'; return; }
      const g = A.slots.map(id => A.tiles[id].c).join('');
      if (answer(g === w, it)){ $$('#ts .tslot').forEach(s => s.classList.add('ok')); say(it.en); okFb(it); nextRound(); }
      else { $$('#ts .tslot').forEach((s,i) => { if (g[i] !== w[i]) s.classList.add('bad'); }); anim($('#ts'),'shake'); $('#fb').className = 'fb bad'; $('#fb').textContent = `Try again! It starts with “${w[0]}”.`; }
    };
  }
}

const FR_STEPS = [5, 15, 35];   /* points for: new friend → friend → best friend (each bar slower) */
const FR_NAMES = [['😊','New friends','знакомые'],['🤝','Friends','друзья'],['💖','Best friends','лучшие друзья']];
function fr(id){ P.friends = P.friends || {}; return P.friends[id] = P.friends[id] || {pts:0, d:{}}; }
function frLevel(id){ let p = fr(id).pts, l = 0; for (const s of FR_STEPS){ if (p >= s){ p -= s; l++; } else break; } return l; }
function frBars(id){
  let p = fr(id).pts;
  return FR_STEPS.map((s,i) => { const v = Math.max(0, Math.min(s, p)); p -= s; const [ic,en,ru] = FR_NAMES[i];
    return `<div class="fbar ${v >= s ? 'done' : ''}"><span>${ic} ${en}<small>${ru}</small></span><div class="bar"><i style="width:${v/s*100}%;background:${['#ffb3c7','#8ccfa4','#ff7aa8'][i]}"></i></div></div>`; }).join('');
}
const doneToday = (id, what) => fr(id).d[what] === todayStr();
function addFriend(id, what, n){
  const f = fr(id); if (f.d[what] === todayStr()) return 0;
  f.d[what] = todayStr();
  const before = frLevel(id); f.pts += n; const after = frLevel(id); save();
  if (after > before) celebrate(id, after);
  return n;
}
function celebrate(id, after){

    const N = NB[id], [ic,en] = FR_NAMES[after-1];

      <button class="btn" id="frOk" style="width:100%">Yay! 💛</button>`, () => { sfx.win(); confetti(['💖','⭐','🤝','✨']); say(after === 3 ? `You are my best friend, ${P.name}!` : after === 2 ? 'We are friends now!' : `Nice to meet you, ${P.name}!`, true); $('#frOk').onclick = () => { closeModal(); if (TOWN === id) visit(id); }; });
  }
}

    colour: () => ({q:"What's your favourite colour?", a:[...shuffle(['Red.','Blue.','Green.','Pink.','Yellow.','Purple.']).slice(0,2).map(x => [x, `Nice! My favourite colour is ${N.color}!`, 1]), ["I'm fine.", 'Hmm? A colour, please! 🙂']]}),
    like: () => ({q:`Do you like ${food}?`, a:[['Yes, I do.', `Me too! Yummy!`, 1],["No, I don't.", `Oh! OK!`, 1],["I'm eight.", 'Hmm? Do you like it? 🙂']]}),
    pet: () => ({q:'Have you got a pet?', a:[[`Yes, I have. It's ${P.pet.name}!`, `Hello, ${P.pet.name}! 👋`, 1],["No, I haven't.", `But I can see ${P.pet.name}! 😄`, 1],['It is red.', 'Hmm? Have you got a pet? 🙂']]}),

      const pl = /s$/.test(it.en) && !/(bus|glass|dress)$/.test(it.en);
      const others = distractors(it, 2, x => !x.ph && x.en.length < 14);
      const say_ = w => pl ? `They're ${w.en}.` : `It's ${art(w.en)} ${w.en}.`;
      return {q: pl ? 'What are these?' : "What's this?", pic:it, a:[[say_(it), `Yes! Well done!`, 1, it], ...others.map(o => [say_(o), 'No! Look again! 🙂'])]}; },
    cold: () => ({q: isSnow() ? 'Is it cold today?' : 'Is it sunny today?', a:[['Yes, it is.', isSnow() ? 'Brrr! Put on your hat!' : 'Hooray! Let’s play outside!', 1],["No, it isn't.", 'OK! Let’s play!', 1],['Yes, I do.', 'Hmm? Is it? 🙂']]}),

function tictactoe(id){
  TOWN = id; const N = NB[id]; const B = Array(9).fill(''); let over = false;
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const winOf = b => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l; return null; };
  view(`<button class="back" id="bk">← ${N.name}</button>

    <div class="ttt" id="ttt">${B.map((_,k) => `<button data-k="${k}"></button>`).join('')}</div>
    <div class="row c"><span class="pill" style="color:#e0567a">You: X</span><span class="pill" style="color:#3d8be8">${N.name}: O</span></div>`);
  const tSay = (t) => { $('#tSay').textContent = t; say(t.replace(/[^\x20-\x7E]/g,''), true); };
  later(() => say("Let's play X and O! Your turn!", true), 250);
  $('#bk').onclick = () => { sfx.click(); visit(id); };
  const draw = () => $$('#ttt button').forEach((b,k) => { b.innerHTML = B[k] === 'x' ? '<svg viewBox="0 0 100 100"><path d="M24 24L76 76M76 24L24 76" stroke="#e0567a" stroke-width="15" stroke-linecap="round"/></svg>' : B[k] === 'o' ? '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" stroke="#3d8be8" stroke-width="14" fill="none"/></svg>' : ''; b.className = B[k]; });
  const finish = (res, line) => {
    over = true; if (line) line.forEach(k => $$('#ttt button')[k].classList.add('win'));
    const txt = res === 'x' ? 'You win! Well done!' : res === 'o' ? 'I win! Again?' : "It's a draw!";
    tSay(txt); res === 'x' ? (sfx.win(), confetti()) : sfx.ok();
    later(() => modal(`<div class="mp">${nbSVG(id,{mood:'joy'})}</div><h2>${txt}</h2>${gameDone(id, res === 'x' ? true : res === 'o' ? false : null)}<div class="mrow"><button class="btn white" id="gAgain">🔄 Again</button><button class="btn" id="gBack">🏠 ${N.name}</button></div>`,
      () => { $('#gAgain').onclick = () => { closeModal(); tictactoe(id); }; $('#gBack').onclick = () => { closeModal(); visit(id); }; }), 1400);
  };
  const aiMove = () => {
    const free = B.map((v,k) => v ? -1 : k).filter(k => k >= 0);
    const tryLine = who => { for (const k of free){ const c = [...B]; c[k] = who; if (winOf(c)) return k; } return -1; };
    let k = tryLine('o');
    if (k < 0 && Math.random() < .75) k = tryLine('x');
    if (k < 0 && !B[4] && Math.random() < .6) k = 4;
    if (k < 0) k = rnd(free);
    B[k] = 'o'; draw(); tone(520,.08,.04);
    const w = winOf(B); if (w) return finish('o', w);
    if (!B.includes('')) return finish('d');
    tSay('Your turn!');
  };
  $$('#ttt button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k; if (over || B[k]) return;
    B[k] = 'x'; draw(); sfx.click();
    const w = winOf(B); if (w) return finish('x', w);
    if (!B.includes('')) return finish('d');
    over = true; $('#tSay').textContent = 'My turn… 🤔';
    later(() => { over = false; aiMove(); }, 800);
  });
}

    <button class="btn" id="prac">📝 Practice now</button>`);

/* ================= SHOP ================= */
function shop(tab = 'pet'){
  const groups = tab === 'pet'
    ? [['🎩 Hats', it => it.slot === 'head'], ['👓 Glasses', it => it.slot === 'eyes'], ['🧣 Necklaces', it => it.slot === 'neck'], ['🦋 Wings & capes', it => it.slot === 'back']]
    : [['🎨 Walls', it => it.wall], ['🟣 Rugs', it => it.rug], ['📚 On the shelf', it => it.spot === 'shelf'], ['🖼️ On the wall', it => it.spot === 'wallL' || it.spot === 'wallR'], ['🧸 On the floor', it => /^floor/.test(it.spot || '')]];
  const nyOwned = NY_ITEMS.some(id => P.owned.includes(id)), wOwned = WINTER_ITEMS.some(id => P.owned.includes(id));
  if (isSnow() || wOwned) groups.unshift(['❄️ Winter', it => tab === 'pet' ? !!it.slot : !it.slot, 'winter']);
  if (isNY() || nyOwned) groups.unshift(['🎄 New Year', it => tab === 'pet' ? !!it.slot : !it.slot, 'ny']);
  const tagOf = it => it.ny ? 'ny' : it.winter ? 'winter' : undefined;
  const avail = it => it.ny ? isNY() : it.winter ? isSnow() : true;
  const isOn = (id, it) => it.slot ? P.wear[it.slot] === id : it.wall ? P.wall === id : it.rug ? P.rug === id : P.room[it.spot] === id;
  const card = ([id,it]) => {
    const own = P.owned.includes(id), off = !avail(it), lock = P.level < it.lvl || off, on = isOn(id, it);
    return `<button class="item card ${on ? 'on' : ''} ${lock && !own ? 'locked' : ''}" data-id="${id}"><div class="ii">${itemIcon(id)}</div><b>${esc(it.name)}</b><small>${own ? (on ? '✔ On' : 'Use') : off ? (it.ny ? '🎄 14 Dec' : '❄️ 17 Nov') : lock ? `🔒 Level ${it.lvl}` : `🪙 ${it.price}`}</small></button>`;
  };
  view(`<button class="back" id="bk">← Home</button><div class="h2">Shop</div><p class="sub center">🪙 ${P.coins} · get coins in the word games!</p>
    <div class="row c"><button class="btn small ${tab === 'pet' ? 'mint' : 'white'}" data-t="pet">For ${esc(P.pet.name)}</button><button class="btn small ${tab === 'room' ? 'mint' : 'white'}" data-t="room">For the room</button></div>
    ${tab === 'pet' ? `<div class="row c"><div style="width:150px">${myPet({mood:'joy'})}</div></div>`
      : `<div class="scene room" style="width:min(100%,300px);align-self:center">${roomHTML()}<div class="petbox">${myPet()}</div></div><p class="note center">Tap the things in the room — ${esc(P.pet.name)} says the English word!</p>`}
    <div class="items">${groups.map(([t,f,tag]) => { const list = Object.entries(ITEMS).filter(([id,it]) => tagOf(it) === tag && f(it) && (avail(it) || P.owned.includes(id))); return list.length ? `<div class="ihead">${t}</div>` + list.map(card).join('') : ''; }).join('')}</div>`);
  $('#bk').onclick = () => { sfx.click(); renderHome(); };
  $$('[data-t]').forEach(b => b.onclick = () => { sfx.click(); shop(b.dataset.t); });
  $$('.item').forEach(b => b.onclick = () => {
    const id = b.dataset.id, it = ITEMS[id], y = window.scrollY;
    if (it.deco) say(it.name);
    if (P.owned.includes(id)){
      if (it.slot){ if (P.wear[it.slot] === id) delete P.wear[it.slot]; else P.wear[it.slot] = id; }
      else if (it.wall) P.wall = P.wall === id ? '' : id;
      else if (it.rug) P.rug = P.rug === id ? '' : id;
      else { if (P.room[it.spot] === id) delete P.room[it.spot]; else P.room[it.spot] = id; }
      save(); sfx.squeak(); shop(tab); window.scrollTo(0, y); return;
    }
    if (it.ny && !isNY()){ sfx.bad(); toast('🎄 New Year things: 14 December – 14 January'); return; }
    if (it.winter && !isSnow()){ sfx.bad(); toast('❄️ Winter things: 17 November – 1 March'); return; }
    if (P.level < it.lvl){ sfx.bad(); toast(`🔒 Level ${it.lvl}`); return; }
    if (P.coins < it.price){ sfx.bad(); toast(`You need ${it.price - P.coins} more 🪙`); return; }
    P.coins -= it.price; P.owned.push(id);
    if (it.slot) P.wear[it.slot] = id;
    if (it.wall) P.wall = id;
    if (it.rug) P.rug = id;
    if (it.deco) P.room[it.spot] = id;
    save(); sfx.coin(); confetti(['🪙','✨'], 10); toast(`🛍️ ${esc(it.name)}!`); shop(tab); window.scrollTo(0, y);
  });
}

function copyText(t){
  const done = () => toast('Скопировано ✔');
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); } catch(e){ fallbackCopy(t, done); }
}
function fallbackCopy(t, done){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Выделите и скопируйте вручную'); } a.remove(); }

/* ================= TEACHER PACK STUDIO ================= */
let ST = null;
function studio(edit){
  setChip('Teacher Pack Studio');
  ST = edit ? JSON.parse(JSON.stringify(edit)) : (ST && !ST.saved ? ST : {id:'pk' + Date.now().toString(36), title:'', words:[]});
  ST.unit = ST.unit || 0; ST.sel = []; ST.saved = false;
  renderStudio();
}
function renderStudio(){
  const inPack = new Set(ST.words.map(w => w.en));
  const can = ST.words.length >= 2 ? '' : 'disabled';
  view(`<button class="back" id="bk">← Back</button><div class="tag center">Teacher Pack Studio</div><div class="h2">Набор слов для ученика</div>

        <div class="chips" id="kbChips">${kbWords(ST.unit).map((w,i) => `<button class="chip ${ST.sel.includes(i) ? 'on' : ''}" data-i="${i}" ${inPack.has(w.en) ? 'style="opacity:.45"' : ''}>${picHTML(w)} ${esc(w.en)}</button>`).join('')}</div>
        <div class="row"><button class="btn small" id="stAdd">➕ Добавить выбранные</button><button class="btn small white" id="stAll">Выбрать все</button></div>
        <p class="note">Фразы (с точкой или вопросом) используются в играх Feed / Walk / Practice как «найди перевод».</p></div>
      <div class="card box"><label>Своё слово или фраза</label>
        <div class="grid2"><input class="in" id="nwEn" placeholder="English: windy"><input class="in" id="nwRu" placeholder="Перевод: ветреный"></div>
        <div class="row"><input class="in" id="nwPic" placeholder="Эмодзи 🌬️" style="width:120px"><button class="btn small white" id="nwImg">📷 Картинка</button><span id="nwPrev" class="wpic">${ST.pendingImg ? `<img src="${ST.pendingImg}">` : ''}</span></div>
        <button class="btn small" id="nwAdd">➕ Добавить слово</button></div>
      <div class="card box"><label>В наборе: ${ST.words.length} (нужно минимум 2)</label>
        <div style="display:flex;flex-direction:column;gap:6px" id="stList">${ST.words.map((w,i) => `<div class="wrow"><span class="wpic">${picHTML(w)}</span><input data-k="en" data-i="${i}" value="${esc(w.en)}"><input data-k="ru" data-i="${i}" value="${esc(w.ru)}"><button class="x" data-i="${i}">✖</button></div>`).join('') || '<p class="note">Пока пусто — добавьте слова выше.</p>'}</div></div>
      <div class="card box">
        <button class="btn mint" id="stTry" ${can}>▶ Сохранить и поиграть</button>
        ${HOSTED ? '' : `<button class="btn" id="stFile" ${can}>💾 Скачать файл набора</button>`}
        <button class="btn white" id="stCode" ${can}>📋 Скопировать код</button>
        ${HOSTED ? '' : `<button class="btn white" id="stLink" ${can}>🔗 Скопировать ссылку</button>`}
        <p class="note">${HOSTED ? 'Как отправить ученику: нажмите «Скопировать код» и пришлите код родителям вместе со ссылкой на игру. Ученик открывает игру по ссылке → «Load my word pack» → вставляет код.'
          : 'Как отправить ученику: пришлите <b>файл игры</b> (pet.html) и <b>файл набора</b>. Ученик открывает игру → «Load my word pack» → выбирает файл набора. Вместо файла можно прислать код — его вставляют в то же окно. Ссылка работает, только если игра лежит в интернете (например, на вашем сайте).'}</p>
      </div>
      ${DB.packs.length ? `<div class="card box"><label>Мои наборы</label>${DB.packs.map(p => `<div class="row"><span style="flex:1;font-weight:800;min-width:0">📦 ${esc(p.title)} (${p.words.length})</span><button class="btn small white" data-edit="${p.id}">✏️</button><button class="btn small white" data-delp="${p.id}">🗑️</button></div>`).join('')}</div>` : ''}

  $('#stTitle').oninput = e => ST.title = e.target.value;
  $('#stUnit').onchange = e => { ST.unit = +e.target.value; ST.sel = []; renderStudio(); };
  $$('#kbChips .chip').forEach(b => b.onclick = () => { const i = +b.dataset.i; ST.sel = ST.sel.includes(i) ? ST.sel.filter(x => x !== i) : [...ST.sel, i]; b.classList.toggle('on'); say(kbWords(ST.unit)[i].en); });
  $('#stAll').onclick = () => { ST.sel = kbWords(ST.unit).map((_,i) => i); renderStudio(); };
  $('#stAdd').onclick = () => {
    const ws = kbWords(ST.unit); let n = 0;
    ST.sel.forEach(i => { const w = ws[i]; if (!ST.words.some(x => x.en === w.en)){ ST.words.push({...w}); n++; } });
    if (!n){ toast('Сначала отметьте слова'); return; }
    ST.sel = []; if (!ST.title.trim()) ST.title = unitTitle(UNITS[ST.unit]); toast(`Добавлено: ${n}`); renderStudio();
  };
  $('#nwImg').onclick = () => $('#fileImg').click();
  $('#nwAdd').onclick = () => {
    const en = $('#nwEn').value.trim(), ru = $('#nwRu').value.trim(), pic = $('#nwPic').value.trim().slice(0,12);

    ST.pendingImg = ''; renderStudio(); setTimeout(() => $('#nwEn') && $('#nwEn').focus(), 50);
  };
  $$('#stList input').forEach(inp => inp.oninput = () => { ST.words[+inp.dataset.i][inp.dataset.k] = inp.value; });
  $$('#stList .x').forEach(b => b.onclick = () => { ST.words.splice(+b.dataset.i, 1); renderStudio(); });
  const packOut = () => storePack(parsePack({id:ST.id, title:(ST.title || 'My word pack').trim(), words:ST.words}));
  const guard = f => () => { try { f(); } catch(e){ toast('Нужно минимум 2 слова'); } };
  $('#stTry').onclick = guard(() => { const pk = packOut(); ST.saved = true; toast('Набор сохранён ✔'); whoPlays(pk.id); });
  if ($('#stFile')) $('#stFile').onclick = guard(() => {
    const pk = packOut();
    const blob = new Blob([JSON.stringify(pk)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (pk.title.replace(/[^\wа-яё\- ]+/gi,'').trim().replace(/\s+/g,'_') || 'word_pack') + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Файл набора скачан ✔');
  });
  $('#stCode').onclick = guard(() => copyText(b64enc(packOut())));
  if ($('#stLink')) $('#stLink').onclick = guard(() => {
    const link = location.href.split('#')[0] + '#pack=' + b64enc(packOut());
    copyText(link);
    if (location.protocol === 'file:') setTimeout(() => toast('Игра открыта с компьютера: ссылка сработает, только если выложить игру в интернет. Проще отправить файл набора или код.'), 1200);
    else if (link.length > 30000) setTimeout(() => toast('Ссылка очень длинная из-за картинок — лучше отправьте файл набора.'), 1200);
  });
  $$('[data-edit]').forEach(b => b.onclick = () => studio(DB.packs.find(p => p.id === b.dataset.edit)));
  $$('[data-delp]').forEach(b => b.onclick = e => { const x = e.currentTarget; if (!x.dataset.sure){ x.dataset.sure = 1; x.textContent = '⚠️'; return; } DB.packs = DB.packs.filter(p => p.id !== x.dataset.delp); save(); renderStudio(); });
}
$('#fileImg').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 160, k = Math.min(1, s / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      ST.pendingImg = c.toDataURL('image/jpeg', .78);
      if ($('#nwPrev')) $('#nwPrev').innerHTML = `<img src="${ST.pendingImg}">`;
    };
    img.onerror = () => toast('Не получилось открыть картинку');
    img.src = r.result;
  };
  r.readAsDataURL(f); e.target.value = '';
};
